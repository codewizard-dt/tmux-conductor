# ──────────────────────────────────────────────
# conductor.conf — Edit this, not the scripts
# ──────────────────────────────────────────────

# --- Session ---
# Name of the tmux session that will hold all agent panes and the monitor.
SESSION_NAME="conductor"

# Agents, background processes, agent↔bg links, and the task queue now live in SQLite (DB_PATH).
# Manage via the dashboard or scripts/add-task.sh.
# Flags appended to each DB-defined agent's launch command.
CLAUDE_FLAGS="--dangerously-skip-permissions"

# --- Background processes ---
# Host-side auxiliary processes (dev servers, watchers, log tailers) that
# should run in their own tmux window alongside the agents. No idle polling,
# no queue dispatch.
#
# Each entry uses the format: <name>:<working_dir>:<launch_cmd>
#   name        — unique tmux window name (must not collide with AGENTS)
#   working_dir — absolute path where the process starts
#   launch_cmd  — the shell command (avoid ':' in the command itself)
BG_PROCESSES=(
)

# --- Agent ↔ bg-process links ---
# Declare which bg process is "owned by" each agent.
# Linked agents receive three extra env vars at spawn time:
#   CONDUCTOR_BG_NAME  — name of the linked bg process
#   CONDUCTOR_BG_LOG   — path to its captured log file ($LOG_DIR/bg-<name>.log)
#   CONDUCTOR_BG_STATE — path to its liveness state file ($STATE_DIR/bg-<name>.state)
# The agent can then do: cat $CONDUCTOR_BG_LOG, cat $CONDUCTOR_BG_STATE (alive|dead).
# Format: "<agent-name>:<bg-process-name>"
AGENT_BG_LINKS=(
  # "my-agent:uat-sleep"
)

# --- Slash commands (vendor-specific vocabulary) ---
# Command sent to an agent to clear its context before a new task.
CLEAR_CMD="/clear"

# --- Idle detection ---
# Primary signal: hooks/claude-hook.sh writes $STATE_DIR/<agent>.state. This
# regex is only consulted when the state file is missing or older than
# 2 * POLL_INTERVAL (fallback layer, e.g. for Aider which has no hooks).
#
# A grep-compatible regex matched against the last 5 lines of capture-pane
# output to determine if an agent is waiting for input (i.e. finished working).
#
# Examples by vendor:
#   Claude Code (v2.x):  "\\?[[:space:]]+for[[:space:]]+shortcuts|(accept edits|bypass permissions) on"
#                        — matches idle footers; plan mode + active-run correctly read as BUSY
#   Claude Code (older): "^[[:space:]]*[>›]"   — ASCII ">" or single-angle "›" prompt
#   Codex:               "^codex>"
#   Aider:               "^aider>"
IDLE_PATTERN="\\?[[:space:]]+for[[:space:]]+shortcuts|(accept edits|bypass permissions) on \\(shift\\+tab to cycle\\)"

# Regex matched against the same pane tail BEFORE IDLE_PATTERN. If it matches,
# the agent is considered busy even when IDLE_PATTERN also matches — current
# Claude Code keeps the permission-mode footer visible while working, so the
# "esc to interrupt" indicator is the reliable busy signal.
BUSY_PATTERN="esc to interrupt"

# Claude/custom regex matched against the last 8 non-blank lines of a busy
# agent's pane to detect that it is waiting for interactive input. Codex uses a
# separate built-in profile in scripts/monitor.sh and host-server/state.ts
# because a bare Codex ">" line means idle prompt chrome, not blocked input.
#
# Matches:
#   \?\s*$    — a line ENDING in a question mark (covers "Rotate anyway?
#               (yes / no / stop)" and multi-line option lists where the "?"
#               line is a few lines above the cursor — the pattern is matched
#               per-line across pane_tail5, so an earlier "?" line still hits).
#               Anchored to end-of-line on purpose: a bare \? matched a "?"
#               ANYWHERE in the tail, so a git-aware shell prompt's untracked
#               indicator (e.g. "repo ?2 ~", as powerlevel10k/starship/oh-my-zsh
#               render by default) misclassified a genuinely idle pane as
#               "awaiting" and silently blocked dispatch. Hooked Claude agents
#               were shielded by the state file, but hookless agents (Aider,
#               Codex, plain shell) fell through to this regex and stalled.
#               Note monitor.sh:108 already excluded bare \? for codex with the
#               comment "a free-floating '?' is usually just user text" — this
#               fixes the same failure at the root instead of per-agent-type.
#   [Y/n]/[y/N] — classic confirm prompts
#   >\s*$     — bare Claude/custom ">" prompt (tmux may pad with trailing spaces)
#   Enter to … / Esc to … — Claude Code AskUserQuestion dialog footer
#   ctrl+g / shift+tab   — Claude Code plan-approval footer
# Case matters: the busy spinner uses lowercase "esc to interrupt" —
# never make this case-insensitive. When matched while state is "busy",
# monitor.sh writes "awaiting" to the state file; the dashboard backend also
# evaluates this pattern read-only for 2s responsiveness.
AWAITING_PATTERN='(\?\s*$|\[Y/n\]|\[y/N\]|>\s*$|Enter to (select|confirm|submit)|Esc to (cancel|go back)|ctrl.g to edit|shift.tab to approve)'

# Seconds between idle-detection polls. Also acts as a debounce — a short
# interval risks false positives while an agent's tool calls are mid-flight.
POLL_INTERVAL=15

# Seconds a busy state file must be old — with no busy/idle pattern visible in
# the pane — before the dashboard marks the agent as stalled. Separate from
# POLL_INTERVAL so that long-running Workflow runs (many sub-agents filling the
# terminal) don't trigger false stalled badges. Default: 300 (5 min).
STALL_TIMEOUT=300

# --- Dashboard live updates ---
# Milliseconds between dashboard status snapshots, normal terminal-card
# captures, and focused terminal captures. Focused defaults are tuned from the
# ROADMAP-015 baseline after removing duplicate focused capture ownership.
STATUS_POLL_MS=2000
TERMINAL_POLL_MS=2000
FOCUSED_TERMINAL_POLL_MS=250

# Focused terminal WebSocket cadence. Leave equal to FOCUSED_TERMINAL_POLL_MS
# unless you want the modal WebSocket to refresh at a different rate.
FOCUSED_TERMINAL_WS_POLL_MS=250

# capture-pane line depths for unfocused terminal cards and focused terminal
# views. Focused views stay deeper than cards while avoiding repeated 500-line
# full-screen snapshots on every modal tick.
TERMINAL_TAIL_LINES=100
FOCUSED_TERMINAL_TAIL_LINES=300

# Maximum rows retained per agent in the agent_terminal_log SQLite table.
# appendTerminalLogChunk (TASK-106) prunes the oldest rows for an agent once
# its row count exceeds this cap, keeping the persisted terminal history
# bounded per agent regardless of how long that agent's session runs.
TERMINAL_LOG_MAX_ROWS_PER_AGENT=500

# Milliseconds between full liveUpdateMetrics snapshots appended to
# $LOG_DIR/observability.jsonl as one 'metrics_snapshot' event (TASK-119).
# liveUpdateMetrics resets to zero on every host-server restart; these
# periodic snapshots are the only way to see what it looked like before one.
METRICS_SNAPSHOT_INTERVAL_MS=60000

# --- Context window ---
# Token capacity used as the denominator for each agent's context-% indicator on
# the dashboard. The transcript can't expose the 1M-context beta flag, so set
# this to 1000000 if your agents run with 1M context. Standard Claude models are
# 200000. Displayed percentage is capped at 100.
CONTEXT_WINDOW=200000

# --- Usage monitoring ---
# A command that exits 0 if usage is OK, exits 1 if the limit is hit.
# The conductor runs this before dispatching a new task to a pane.
# If it exits 1, that pane is paused (no new tasks dispatched).
# If ALL panes are paused, the conductor shuts down gracefully.
#
# Examples:
#   OpenAI:  check `codex usage` or call the billing API
#   Always OK (no limit checking): "true"
#
# NOTE: use bare `true`, NOT "/bin/true". macOS has no /bin/true (it lives at
# /usr/bin/true), so the "/bin/true" this file used to suggest would fail with
# "No such file or directory" and exit NON-ZERO — which monitor.sh reads as
# LIMIT HIT, pausing every agent and potentially triggering auto-teardown.
# Verified on this machine: `/bin/true` -> exit 1; bare `true` -> exit 0.
#
# DISABLED 2026-08-15 — there is currently NO automated usage-limit checking.
# The previous value was:
#   'claude usage 2>/dev/null | grep -qi "extra usage" && exit 1 || exit 0'
# `usage` is NOT a claude subcommand (verified against claude v2.1.233 --help:
# agents, auth, auto-mode, doctor, gateway, import, install, mcp, plugin,
# project, setup-token, ultrareview, update). Since the CLI signature is
# `claude [options] [command] [prompt]`, the word "usage" fell through to the
# PROMPT argument — so this "check" launched a full agentic Claude Code turn
# once per idle agent per poll tick, and then grepped the conversational reply
# for "extra usage". Consequences, all confirmed:
#   1. It BURNED usage rather than measuring it (measured 5.9s-114s per call,
#      mean ~48.6s; monitor.sh runs it sequentially per idle agent per tick with
#      no timeout and no caching, so it also dominated dispatch latency).
#   2. It was a false NEGATIVE by default — ordinary replies don't contain
#      "extra usage" — so auto-teardown protection was already inert, not
#      merely weakened by disabling it here.
#   3. It was a false POSITIVE landmine — the literal string "extra usage"
#      appears in this very file and in TASK-120's task file, so an agentic turn
#      that happened to read either would echo it back and report a phantom
#      limit-hit, pausing agents or triggering teardown.
# Setting /bin/true makes the existing inertness explicit and stops the burn.
# Restoring real limit checking needs a genuine quota signal — see the
# follow-up task; `claude auth status` is fast but reports tier, not quota.
USAGE_CHECK_CMD='true'

# --- SQLite database ---
# Path to the conductor SQLite database file (resolved relative to this conf file).
# Created automatically on first backend start; gitignored via data/ entry.
DB_PATH="./data/conductor.db"

# --- Logging ---
# Directory where per-agent log files are written (host side).
# monitor.sh appends one JSONL record per dispatch to $LOG_DIR/dispatch.jsonl
# (fields: ts, agent, command, state, state_age_s, detection, queue,
#  queue_remaining, pane_tail).
LOG_DIR="./logs"

# --- Agent state directory ---
# Per-agent lifecycle state written by Claude Code hooks
# (see hooks/on-session-start.js, on-prompt-submit.js, on-stop.js,
# on-stop-failure.js). Each agent writes idle|busy to
# $STATE_DIR/<agent-name>.state. monitor.sh reads these files to decide
# idle/busy; IDLE_PATTERN above is the fallback when the state file is
# missing or stale (older than 2 * POLL_INTERVAL).
STATE_DIR="./logs/state"
